name: Android CI - Build NetShield X

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Unit tests dan assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Tidak memakai android-actions/setup-android: runner ubuntu-latest
      # sudah menyediakan Android SDK lengkap (ANDROID_HOME) dengan
      # lisensi yang sudah diterima. Percobaan sebelumnya dengan
      # setup-android@v3 gagal karena action itu mencoba menginstal
      # paket usang "tools" yang sudah tidak ada di repositori
      # (sdkmanager exit code 1, "Failed to find package 'tools'").

      - name: Beri izin eksekusi pada Gradle Wrapper
        run: chmod +x gradlew

      - name: Jalankan unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: NetShield-X-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
